services:
    smart-app:
        container_name: smart-app
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: prod
        image: smart-app:latest
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        env_file:
            - .env
        volumes:
            - smart_storage:/var/www/smart/storage/app
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        networks:
            - app-network

    smart-queue:
        container_name: smart-queue
        restart: unless-stopped
        image: smart-app:latest
        command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
        env_file:
            - .env
        volumes:
            - smart_storage:/var/www/smart/storage/app
        depends_on:
            smart-app:
                condition: service_healthy
            db:
                condition: service_healthy
        networks:
            - app-network

    smart-scheduler:
        container_name: smart-scheduler
        restart: unless-stopped
        image: smart-app:latest
        command: ["php", "artisan", "schedule:work"]
        env_file:
            - .env
        volumes:
            - smart_storage:/var/www/smart/storage/app
        depends_on:
            smart-app:
                condition: service_healthy
            db:
                condition: service_healthy
        networks:
            - app-network

    db:
        image: "mcr.microsoft.com/mssql/server:2022-latest"
        container_name: db
        restart: unless-stopped
        volumes:
            - sqlvolume:/var/opt/mssql
        # Port 1433 is internal only in production for security hardening
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
            MSSQL_PID: ${MSSQL_PID:-Developer}
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1'"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
        networks:
            - app-network

volumes:
    sqlvolume:
    smart_storage:
    caddy_data:
    caddy_config:

networks:
    app-network:
        driver: bridge
