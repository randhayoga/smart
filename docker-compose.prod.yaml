services:
    smart-app:
        container_name: smart-app
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/Dockerfile.prod
            target: prod
        image: smart-app:latest
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - smart_storage:/var/www/smart/storage/app
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        networks:
            - app-network

    # ==========================================
