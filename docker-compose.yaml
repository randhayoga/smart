services:
    smart-app:
        container_name: smart-app
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: smart-app:frankenphp
        volumes:
            - .:/var/www/smart
            - ./docker/docker-php-size.ini:/usr/local/etc/php/conf.d/docker-php-size.ini
        ports:
            - "443:443"
            - "443:443/udp"
            - "5173:5173"
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
        networks:
            - app-network

    db:
        image: "mcr.microsoft.com/mssql/server:2022-latest"
        container_name: db
        restart: unless-stopped
        volumes:
            - sqlvolume:/var/opt/mssql
        ports:
            - "1433:1433"
        environment:
            ACCEPT_EULA: Y
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
            MSSQL_PID: Developer
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1'"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
        networks:
            - app-network

    db-init:
        image: "mcr.microsoft.com/mssql/server:2022-latest"
        container_name: db-init
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./docker/init-db.sh:/usr/local/bin/init-db.sh:ro
        entrypoint: ["/bin/bash", "/usr/local/bin/init-db.sh"]
        env_file:
            - .env
        restart: "no"
        networks:
            - app-network

    # TESTING
    # cloudflared:
    #     image: cloudflare/cloudflared:latest
    #     container_name: cloudflare_tunnel
    #     command: tunnel --no-autoupdate run
    #     environment:
    #         - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    #     restart: unless-stopped
    #     networks:
    #         - app-network

networks:
    app-network:
        driver: bridge

volumes:
    sqlvolume: